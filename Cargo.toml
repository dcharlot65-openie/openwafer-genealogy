[package]
name = "openwafer-genealogy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "The open genealogy schema for semiconductor fabs: recipes, process runs, tool traces, metrology and electrical results joined through each wafer's genealogy, with units, uncertainty, provenance and licence on every record. Validator, adapters and CLI."
keywords = ["semiconductor", "fab", "mes", "genealogy", "metrology"]
categories = ["science", "command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing, so a JSON Lines round trip is bit-exact.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
schemars = { version = "1", features = ["derive"] }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"], optional = true }
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }

[features]
default = []
# Parquet export and import of the tables.
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]

[[bin]]
name = "owg"
path = "src/bin/owg.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"
